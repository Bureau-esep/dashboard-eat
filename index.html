<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Charte ESEP : bleu nuit domine, orange accentue (filets, aplats, chiffres clés), Oswald en majuscules
   pour les titres, DM Sans pour le texte, angles droits, pas d'ombre. Un seul thème, clair, avec bandeau bleu nuit. */
:root{
  --nuit:#01002C; --nuit-fond:#0B1530; --orange:#FF9900; --on-accent:#01002C; --gris-bleu:#4B4B68;
  --paper:#F3F4F8; --sheet:#FFFFFF; --sheet-2:#F3F4F8; --ink:#01002C; --ink-2:#4B4B68; --muted:#6E6E88;
  --line:#D9DBE6; --grid:#E6E8F0; --base:#B7BACB;
  --accent:#01002C; --accent-ink:#FFFFFF; --accent-soft:#E7E8F2;
  --route:#FF9900; --route-ink:#01002C; --route-soft:#FFF1DA; --accent-doux:#FFF1DA;
  --good:#0ca30c; --good-ink:#006300; --good-soft:#e2f3e2;
  --warn:#fab219; --warn-ink:#7d5200; --warn-soft:#fdf1d6;
  --crit:#d03b3b; --crit-ink:#a82727; --crit-soft:#f8e1e1;
  --s1:#3B4BA8; --s2:#F08C00; --s3:#1F9E8A; --s4:#9C6ADE; --s5:#E87BA4; --s6:#008300; --s7:#E34948; --s8:#EDA100;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --sans:"DM Sans",Arial,system-ui,sans-serif;
  --mono:"DM Sans",Arial,sans-serif;
  --r:0; --shadow:none;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
@media (max-width:520px){.wrap{padding:0 14px}}

/* ---------- header ---------- */
.top{padding-top:22px;padding-bottom:10px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font:700 clamp(40px,6vw,58px)/.9 var(--display);letter-spacing:.01em;text-transform:uppercase}
.brand h1 .yr{color:var(--orange)}
.brand p{margin:0;font:500 13px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.fpl{display:flex;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);font-family:var(--mono);font-size:12px;overflow:hidden}
.fpl div{padding:5px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.fpl div:last-child{border-right:0}
.fpl b{font-weight:600;font-size:13px}
.fpl small{font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--warn)} .sync.bad i{background:var(--crit)}

.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;padding:12px 14px 10px;font:600 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--route-ink)}
.tabs a .n{font:500 11px/1 var(--mono);color:var(--muted)}
.tabs .wrap{flex-direction:column;gap:0}
.tabs .spaces,.tabs .subs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .subs{border-top:1px solid var(--line);padding:2px 0}
.tabs .subs a{padding:8px 12px 7px;font:600 13.5px/1 var(--sans);letter-spacing:.02em;text-transform:none;border-bottom-width:2px}
.tabs .subs a[aria-current="page"]{border-bottom-color:var(--orange)}
.tabs .nb{display:inline-block;min-width:18px;padding:2px 5px;font:700 11px/1 var(--sans);letter-spacing:0;background:var(--orange);color:#01002C;text-align:center}
.ready-top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.chk{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.chk li a{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-size:14px;margin-bottom:4px}
.chk li a:hover .l{text-decoration:underline}
.chk .ck{width:18px;height:18px;flex:none;border:2px solid var(--muted);display:grid;place-items:center;font:700 12px/1 var(--sans)}
.chk li.ok .ck{background:var(--good);border-color:var(--good);color:#fff}
.chk .l{flex:1}
.chk .v{font:500 12.5px/1 var(--mono);color:var(--ink-2)}
.cd-big{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.ech{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.ech li a{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.ech li a:hover span:last-child{text-decoration:underline}
.ech .mono{font-size:12px;color:var(--ink-2)}
.alerts li .lnk{display:inline-block;margin-top:4px;font-size:13px}
.mvtabs{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.mvtabs button{all:unset;cursor:pointer;padding:9px 14px;font:600 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--sheet);color:var(--ink-2)}
.mvtabs button[aria-pressed="true"]{background:var(--nuit);border-color:var(--nuit);color:#fff}
:root[data-mode="nuit"] .mvtabs button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#01002C}
.mvtabs button:focus-visible{outline:2px solid var(--accent)}
.mvtabs button .nb{margin-left:6px;padding:1px 5px;background:var(--orange);color:#01002C;font:700 11px/1 var(--sans)}

main.wrap{padding-top:22px;padding-bottom:60px;display:flex;flex-direction:column;gap:18px}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn-ink);font-size:14px;border:1px solid rgba(250,178,25,.45)}

/* ---------- cards ---------- */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.card>h2,.h2{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.sub{margin:4px 0 14px;color:var(--ink-2);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.eyebrow{font:600 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.head-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:22px;align-items:stretch}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-main{display:flex;flex-direction:column;gap:8px;padding-right:8px}
.hero-fig{font:600 clamp(48px,7vw,68px)/1 var(--sans);letter-spacing:-.02em}
.hero-fig.neg{color:var(--crit-ink)}
.hero-sub{color:var(--ink-2);font-size:14px}
.flag{display:inline-flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:13.5px;line-height:1.35}
.flag svg{flex:none;margin-top:1px}
.flag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.flag.crit{background:var(--crit-soft);color:var(--crit-ink)}
.flag.good{background:var(--good-soft);color:var(--good-ink)}
.flag.info{background:var(--accent-soft);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--sheet-2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lab{font-size:13px;color:var(--ink-2)}
.tile.hl{background:var(--route-soft)}
.tile.hl .val{color:var(--ink)}
.tile .val{font:600 26px/1.05 var(--sans)}
.tile .foot{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter.over>i{background:var(--crit)}
.meter.good>i{background:var(--good)}

/* route strip */
.route{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);overflow-x:auto;padding:4px 2px 6px}
.route{--wpy:118px}
.route.big{--wpy:148px}
.stop::before{content:"";position:absolute;left:0;right:0;top:var(--wpy);height:3px;background:var(--route)}
.stop:first-child::before{left:50%}
.stop:last-child::before{right:50%}
.stop:only-child::before{display:none}
.stop{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px 6px;border-radius:8px;text-align:center}
.stop:hover,.stop:focus-visible{background:var(--route-soft)}
.stop:focus-visible{outline:2px solid var(--route);outline-offset:1px}
.alt{height:108px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.route.big .alt{height:138px}
.alt .v{font:600 13px/1 var(--sans);color:var(--ink)}
.alt .col{width:22px;border-radius:4px 4px 0 0;background:var(--s3)}
.wp{width:18px;height:18px;margin-top:-2px;position:relative;z-index:1}
.stop .j{font:600 11px/1 var(--mono);color:var(--route-ink);letter-spacing:.06em;margin-top:2px}
.stop .city{font:600 16px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.stop .tot{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.route-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);margin-top:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font:600 11.5px/1.2 var(--sans);white-space:nowrap;border:1px solid transparent;background:var(--sheet-2);color:var(--ink-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-soft);color:var(--good-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.crit{background:var(--crit-soft);color:var(--crit-ink)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
button.chip{cursor:pointer}
button.chip:hover{border-color:currentColor}

/* donut + bars */
.donut-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.donut-wrap svg{flex:none;width:200px;height:200px}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:200px}
.legend .li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-size:14px}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .num{font-variant-numeric:tabular-nums;text-align:right}
.legend .pc{color:var(--muted);font-variant-numeric:tabular-nums;width:3.2em;text-align:right;font-size:13px}
.pvr{display:flex;flex-direction:column;gap:12px}
.pvr .grp{font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pvr .r{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;align-items:center}
.pvr .r .nm{font-size:14px;font-weight:500}
.pvr .r .vals{grid-column:2;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{position:relative;height:12px;border-radius:0 4px 4px 0;background:var(--sheet-2)}
.bar .pv{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--accent-soft);border-right:2px solid var(--base)}
.bar .rl{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 4px 4px 0;background:var(--accent)}
.bar .rl.over{background:var(--crit)}
.bar .rl.inc{background:var(--good)}

/* svg charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:12px var(--sans);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bl{stroke:var(--base);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .xh{stroke:var(--ink-2);stroke-width:1;opacity:0;pointer-events:none}
.chart g.col:hover .xh,.chart g.col:focus .xh{opacity:.5}
.chart g.col:focus{outline:none}
.empty-note{fill:var(--ink-2)!important;font-size:13px!important}
.lgd{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:8px;font-size:14px;background:var(--sheet-2)}
.alerts li svg{flex:none;margin-top:2px}
.alerts li.crit{background:var(--crit-soft)} .alerts li.warn{background:var(--warn-soft)}
.alerts li .t{font-weight:600}
.alerts li .d{color:var(--ink-2);font-size:13px}

/* segmented */
.seg-bar{display:flex;gap:2px;height:28px;margin:10px 0 8px}
.seg-bar>div{border-radius:4px;display:flex;align-items:center;padding:0 8px;font:600 12px/1 var(--sans);color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.seg-bar>div.dk{color:#0b0b0b}
.ppl{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media (max-width:700px){.ppl{grid-template-columns:1fr}}
.ppl-in{background:var(--sheet-2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:190px}
.ppl-in .big{font:600 34px/1 var(--sans)}
.ppl-in .note b{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 11.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;border-top:1.5px solid var(--ink);border-bottom:0}
.scroll{overflow-x:auto}

/* inputs */
.in{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 7px;transition:border-color .12s,background .12s}
.in:hover{border-color:var(--line);background:var(--sheet)}
.in:focus{outline:none;border-color:var(--accent);background:var(--sheet);box-shadow:0 0 0 3px var(--accent-soft)}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.fld input,.fld select,.box{background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);font-size:15px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.icon-btn{all:unset;cursor:pointer;width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--crit-soft);color:var(--crit-ink)}
.icon-btn.edit:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;padding:8px 6px;border-radius:6px}
.add:hover{background:var(--accent-soft)}
.add:focus-visible{outline:2px solid var(--accent)}

/* budget */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,760px),1fr));gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.side>.h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cat{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.cat-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sheet-2);border-bottom:1px solid var(--line)}
.cat-h .code{font:600 12px/1 var(--mono);color:var(--muted)}
.cat-h .sw{width:10px;height:10px;border-radius:3px}
.cat-h h3{margin:0;font:700 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;flex:1}
.cat-h .t{font:600 16px/1 var(--sans);font-variant-numeric:tabular-nums}
.lines{min-width:970px}
.ln select.alloc{font-size:13px;font-weight:600}
.ln select.alloc.part{color:var(--s1)}
.ln select.alloc.org{color:var(--route-ink)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.who{background:var(--sheet-2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.who .big{font:600 34px/1.05 var(--sans)}
.who .seg-bar{margin:8px 0 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.p{background:var(--s1)} .dot.o{background:var(--route)}
.ln .in{background:var(--sheet-2);border-color:var(--line)}
.ln .in:hover{border-color:var(--accent)}
.ln select.in{padding:5px 4px}
.dayin{display:flex;align-items:center;gap:6px}
.dayin.meal .mt{flex:none;width:74px;padding:5px 2px;font-weight:600;font-size:13px}
.dayin.meal .mt.midi{color:var(--s4)} .dayin.meal .mt.soir{color:var(--s7)}
.mealsum{display:flex;flex-wrap:wrap;gap:6px 20px;padding:10px 12px;background:var(--sheet-2);border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.mealsum b{color:var(--ink)}
.mealsum .t{margin-left:auto}
.dayin small{font:600 11px/1 var(--mono);color:var(--route-ink);flex:none;width:20px}
.ln .amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.lacts{display:flex;align-items:center;gap:0;justify-content:flex-end}
.lacts .icon-btn{width:24px}
.lacts .add.sm{font-size:12.5px;padding:4px 4px}
.icon-btn:disabled{opacity:.25;pointer-events:none}
.mv{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink-2);font-size:12px;cursor:pointer;padding:0 2px}
.cat-h .in{background:transparent;border-color:transparent}
.cat-h .in:hover{border-color:var(--line);background:var(--sheet)}
.cat-h .in.code{width:44px;flex:none;font:600 12px/1 var(--mono);color:var(--muted);text-align:center}
.cat-h .in.ttl{flex:1;font:700 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.params{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.params .wide{grid-column:span 2}
.params .wide:last-child{grid-column:span 4}
@media (max-width:760px){.params{grid-template-columns:1fr 1fr}.params .wide,.params .wide:last-child{grid-column:1/-1}}
.ln{display:grid;grid-template-columns:minmax(200px,1fr) 64px 96px 90px 104px 120px 124px 122px;gap:4px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--line)}
.ln.hd{font:600 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 8px 6px}
.ln.hd span:nth-child(n+2){text-align:right}
.ln.hd span:nth-child(3){text-align:left;padding-left:7px}
.ln.hd span:nth-child(1){padding-left:7px}
.ln .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ln .real{display:flex;flex-direction:column;gap:3px;align-items:stretch;font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.ln .real .meter{height:4px}
.ln .ro{padding:5px 7px;font-weight:500}
.ln .ro small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-right:6px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.totals .tile .val{font-size:24px}
.note{font-size:13px;color:var(--ink-2)}
.note b{color:var(--ink)}

/* hébergement */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.day{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);scroll-margin-top:70px}
.day.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--route)}100%{box-shadow:var(--shadow)}}
.day header{display:flex;gap:8px;align-items:center}
.day header .j{font:600 13px/1 var(--mono);color:var(--on-accent);font-weight:700;background:var(--route);padding:5px 7px;border-radius:5px}
.day header .city{font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--sheet-2);border-radius:8px;padding:10px}
.kp div{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.kp b{font:600 16px/1.1 var(--sans);color:var(--ink)}

/* saisie */
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:12px}
.segc{display:grid;grid-template-columns:1fr 1fr;background:var(--sheet-2);border-radius:9px;padding:3px;gap:3px}
.segc button{all:unset;cursor:pointer;text-align:center;padding:8px;border-radius:7px;font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.segc button[aria-checked="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.segc button[aria-checked="true"].dep{color:var(--crit-ink)}
.segc button[aria-checked="true"].rec{color:var(--good-ink)}
.segc button:focus-visible{outline:2px solid var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters select,.filters input{background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:14px}
.filters input{flex:1;min-width:150px}
.sums{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--ink-2);margin-bottom:10px}
.sums b{color:var(--ink);font-variant-numeric:tabular-nums}
.typ{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.typ.depense{background:var(--crit)} .typ.recette{background:var(--good)}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:10px;font-size:14px;line-height:1.5}
.empty b{display:block;font:700 18px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

/* équipages : bandes de progression façon strips ATC */
.strips{display:flex;flex-direction:column;gap:10px}
.strip{display:grid;grid-template-columns:8px minmax(170px,1fr) 104px 104px 46px 90px 84px minmax(180px,1.15fr) 226px;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 0;box-shadow:var(--shadow)}
.strip .band{align-self:stretch;border-radius:8px 0 0 8px;margin:-8px 0}
.strip .band.eigsi{background:var(--s1)} .strip .band.hors{background:var(--s2)}
.strip .nm .in{font:700 18px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;text-overflow:ellipsis}
.strip .reg .in{font-family:var(--mono);text-transform:uppercase}
.strip label.mini{display:flex;flex-direction:column;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;gap:1px}
.strip select.in{appearance:auto}
.strip.org{grid-template-columns:8px minmax(160px,1fr) 190px 190px 64px minmax(160px,1.2fr) 40px}
.strip.org .band{grid-row:span 2;margin-bottom:-8px}
.strip.out{opacity:.62}
.strip.out .nm .in{text-decoration:line-through}
.strip label.mini .in{font-size:14.5px;letter-spacing:0;text-transform:none;color:var(--ink)}
.strip label.mini.reg .in{text-transform:uppercase}
.strip .acts{justify-content:flex-end}
.crewbox{display:flex;flex-direction:column}
.crewbox.open .strip{border-bottom-left-radius:0;border-bottom-right-radius:0}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mem{background:var(--sheet-2);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:10px 12px 6px 18px;display:flex;flex-direction:column;gap:4px}
.mrow{display:grid;grid-template-columns:1fr 1fr 190px 1.6fr 28px;gap:6px;align-items:center}
.mrow.hd{font:600 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 0}
.mrow .in,.org-x .in{background:var(--sheet);border-color:var(--line)}
select.in.unset{color:var(--muted)}
@media (max-width:900px){.mrow{grid-template-columns:1fr 1fr}.mrow.hd{display:none}.mrow{padding:6px 0;border-bottom:1px solid var(--line)}}
.org-x{grid-column:2/-1;display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:end;padding-top:2px}
@media (max-width:1100px){.org-x{grid-column:1/-1;grid-template-columns:1fr 1fr}}
.drs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px}
.h3{margin:0 0 10px;font:700 15px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.h4{margin:14px 0 6px;font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.diets{display:flex;flex-wrap:wrap;gap:6px}
.dchip{background:var(--sheet-2);border-radius:999px;padding:5px 11px;font-size:13.5px}
.dchip b{font-variant-numeric:tabular-nums;margin-right:2px}
.dchip.unk{color:var(--muted);border:1px dashed var(--line);background:transparent}
.alg{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.room{background:var(--sheet-2);border-radius:8px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--s3)}
.room.none{border-left-color:var(--warn);background:transparent;border:1px dashed var(--line);border-left:3px solid var(--warn)}
.room .rh{display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
.room .rh span{font-size:12px;color:var(--muted)}
.strip .pay{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.strip .acts{display:flex;gap:6px;align-items:center}
@media (max-width:1100px){
  .strip,.strip.org{position:relative;grid-template-columns:1fr 1fr;padding:10px 10px 10px 18px}
  .strip .band{position:absolute;left:0;top:0;bottom:0;width:8px;margin:0}
  .strip .nm,.strip .pay,.strip .acts{grid-column:1/-1}
}

/* scénarios */
.scn{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px;align-items:start}
@media (max-width:900px){.scn{grid-template-columns:1fr}}
.ctl{display:flex;flex-direction:column;gap:16px}
.ctl .grp{font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rng{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rng .top{display:flex;justify-content:space-between;gap:10px}
.rng output{font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.imp{display:flex;flex-direction:column;gap:8px}
.imp .r{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 90px;gap:10px;align-items:center;font-size:14px}
.imp .axis{position:relative;height:14px;background:linear-gradient(var(--base),var(--base)) 50% 0/1px 100% no-repeat}
.imp .axis i{position:absolute;top:1px;bottom:1px}
.imp .axis i.pos{left:50%;background:var(--s1);border-radius:0 4px 4px 0}
.imp .axis i.neg{right:50%;background:var(--crit);border-radius:4px 0 0 4px}
.imp .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* déplacements */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.leg{background:var(--sheet-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:3px solid var(--route)}
.leg header{display:flex;align-items:center;gap:8px}
.leg header .j{font:600 12px/1 var(--mono);color:var(--on-accent);font-weight:700;background:var(--route);padding:4px 6px;border-radius:4px}
.leg header .when{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.leg .ft{display:flex;align-items:center;gap:8px;font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;flex-wrap:wrap}
.leg .ft svg{color:var(--route-ink);flex:none}
.vg{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.vg .vh{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.vg .vh span{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.vg .vh span.over{color:var(--crit-ink);font-weight:600}
.vg .names{font-size:13px;color:var(--ink-2);line-height:1.4}
.vg .names .mono{font-size:11.5px}
.vg.crews{border-style:dashed}
.vg.svcs{border-color:#f0b597;background:transparent}
.whosel{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.whosel select{background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:14px;max-width:260px}
.itin{display:flex;flex-direction:column;gap:6px}
.it{display:grid;grid-template-columns:36px 170px minmax(200px,1.2fr) minmax(160px,1fr) minmax(120px,1fr);gap:10px;align-items:center;padding:9px 12px;background:var(--sheet-2);border-radius:8px;font-size:14px}
.it .j{color:var(--route-ink);font-weight:600}
.it .ft{display:flex;align-items:center;gap:8px;font-weight:600}
.it .ft svg{color:var(--route-ink)}
.it .v{font-weight:600}
.it.abs{opacity:.55}
@media (max-width:800px){.it{grid-template-columns:36px 1fr}.it .ft,.it .v,.it .note{grid-column:2}}
.tbl.mx th{font-size:10.5px;vertical-align:bottom;white-space:nowrap}
.tbl.mx th .mono{color:var(--route-ink)}
.tbl.mx td{padding:4px 6px}
.tbl.mx .who-cell{min-width:170px}
.tbl.mx .who-cell b{font-weight:600}
.typ.c{background:var(--s1)} .typ.o{background:var(--route)}
select.asg{min-width:150px;font-size:13px;background:var(--sheet);border-color:var(--line)}
select.asg.set{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.legs-ed{min-width:780px;display:flex;flex-direction:column}
.lr{display:grid;grid-template-columns:52px 128px 1fr 1fr 84px 84px 1.2fr 28px;gap:4px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.lr.hd{font:600 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.lr .in{background:var(--sheet-2);border-color:var(--line)}
.vehs{display:flex;flex-direction:column;gap:6px;max-width:640px}
.stack{display:flex;flex-direction:column;gap:18px}
.vr{display:grid;grid-template-columns:1fr 110px 64px auto 28px;gap:6px;align-items:center}
.vr .in{background:var(--sheet-2);border-color:var(--line)}

/* services & planning véhicules */
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.pd{background:var(--sheet-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pdh{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.pdh .j{font:600 12px/1 var(--mono);color:var(--on-accent);font-weight:700;background:var(--route);padding:4px 6px;border-radius:4px}
.pdh .dt{font-size:13px;color:var(--ink-2)}
.pdh .city{font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin-left:auto}
.pi{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px}
.pi .tm{font:500 12px/1 var(--mono);color:var(--ink-2);min-width:84px}
.pi .what{flex:1;min-width:150px}
.tag{font:600 10.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:4px}
.tag.g{background:var(--accent-soft);color:var(--accent)}
.tag.s{background:#fbe5da;color:#9a3d12}
:root[data-mode="nuit"] .tag.s{background:#3a2016;color:#f0a27e}
.tbl.vp th{font-size:10.5px;white-space:nowrap;vertical-align:bottom}
.tbl.vp th .mono{color:var(--route-ink)}
.tbl.vp td{vertical-align:top;min-width:130px;padding:6px}
.tbl.vp td.vn{min-width:150px}
.blk{font-size:12px;line-height:1.3;padding:4px 6px;border-radius:5px;margin-bottom:4px;border-left:3px solid var(--s1);background:var(--accent-soft);cursor:default}
.blk.k-svc{border-left-color:var(--s2);background:#fbe5da}
:root[data-mode="nuit"] .blk.k-svc{background:#3a2016}
.blk.cf{border-left-color:var(--crit);background:var(--crit-soft)}
.blk .tm{font:500 11px/1 var(--mono);color:var(--ink-2)}
.free{font-size:12px;color:var(--muted)}
.frise{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.lanes{display:flex;flex-direction:column;gap:6px;margin-top:10px;min-width:640px}
.lane{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center}
.lane .ln-n{font-size:13px;font-weight:600}
.lane .track{position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 12.5%),var(--sheet-2);border-radius:6px}
.lane.ticks .track{height:16px;background:none}
.lane.ticks .track span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lane .bar{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--s1);color:#fff;font-size:11px;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.lane .bar.k-svc{background:var(--s2)}
.lane .bar.cf{background:var(--crit)}
.lane .ut{font-size:11.5px;color:var(--muted)}
.svc-new{display:grid;grid-template-columns:1.4fr 1.2fr 96px 96px 1fr 1fr 110px 110px auto;gap:8px;align-items:end}
@media (max-width:1100px){.svc-new{grid-template-columns:1fr 1fr 1fr}}
.svc-ed{display:flex;flex-direction:column}
.svr{display:grid;grid-template-columns:118px 1.1fr 170px 150px 84px 84px 1fr 120px 28px;gap:4px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.svr.hd{font:600 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.svr .in{background:var(--sheet-2);border-color:var(--line);font-size:13.5px}
select.in.miss{border-color:var(--warn);background:var(--warn-soft)}
@media (max-width:1000px){.svr{grid-template-columns:1fr 1fr 1fr;padding:8px 0}.svr.hd{display:none}}
.pi-sel{display:flex;gap:6px;width:100%}
.pi-sel select{flex:1;min-width:0;font-size:12.5px;padding:4px 6px;background:var(--sheet-2);border-color:var(--line)}
.it .tag{justify-self:start}
/* chambres */
.rtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.rtab{all:unset;cursor:pointer;flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:8px;background:var(--sheet-2);border:1px solid var(--line);font:600 14px/1.1 var(--sans)}
.rtab .mono{color:var(--route-ink);font-size:12px}
.rtab small{font:400 11.5px/1 var(--sans);color:var(--muted)}
.rtab.on{background:var(--route-soft);border-color:var(--route-ink)}
.rtab:focus-visible{outline:2px solid var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{background:var(--sheet-2);border:1px solid var(--line);border-left:3px solid var(--s3);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.rcard.full{border-left-color:var(--good)}
.rcard.over{border-left-color:var(--crit);background:var(--crit-soft)}
.rch{display:flex;align-items:center;gap:6px}
.rch .rname{flex:1;font-weight:600;background:var(--sheet);border-color:var(--line)}
.rbeds{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.rbeds .in{width:48px;background:var(--sheet);border-color:var(--line)}
.slots{display:flex;flex-direction:column;gap:4px}
.slot{background:var(--sheet);border-color:var(--line);font-size:13.5px}
.slot.extra{border-color:var(--crit);background:var(--crit-soft)}
.slot.dup{border-color:var(--crit);color:var(--crit-ink);font-weight:600}
.rcf{font-size:12px;color:var(--muted)}
.nl{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* liste de recherche */
.combo{position:fixed;z-index:65;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px -10px rgba(0,0,0,.35);overflow-y:auto;padding:4px 0;font-size:14px}
.cb-h{padding:6px 12px;font-size:11.5px;color:var(--muted)}
.cb-g{padding:8px 12px 3px;font:600 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--route-ink)}
.cb-o{padding:7px 12px 7px 18px;cursor:pointer}
.cb-o:hover,.cb-o.on{background:var(--accent-soft)}
.cb-e{padding:10px 12px;color:var(--ink-2);font-size:13px}
.rsearch{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.rsearch input{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px;max-width:460px}
.rsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#rsearch-out{display:flex;flex-direction:column;gap:6px}
.ws{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 10px;background:var(--sheet-2);border-radius:8px}
.ws-n{min-width:200px}
.ws-d{display:flex;flex-wrap:wrap;gap:4px}
.wsd{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:baseline;font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--good-soft);color:var(--good-ink)}
.wsd .mono{font-size:11px;color:var(--route-ink)}
.wsd.no{background:var(--warn-soft);color:var(--warn-ink)}
.wsd:focus-visible{outline:2px solid var(--accent)}
.slot.hit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* plans des voitures (app + documents) */
.car{position:relative;flex:none}
.car .car-svg{position:absolute;inset:0;width:100%;height:100%}
.car .seat{position:absolute;transform:translate(-50%,-50%);width:82px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}

/* tooltip, modal, toast */
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--sheet);padding:7px 10px;border-radius:7px;font-size:13px;line-height:1.35;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;white-space:pre-line}

/* page-load : l'itinéraire se trace une fois */
@media (prefers-reduced-motion:no-preference){
  .route.anim .stop::before{animation:draw .5s linear both;animation-delay:calc(var(--i) * 110ms)}
  .route.anim .col{animation:rise .7s cubic-bezier(.3,.7,.2,1) both;transform-origin:bottom}
  @keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes rise{from{transform:scaleY(.15)}to{transform:none}}
}

function calc(over) {

  }
  const cats = {};

  let attente = 0, refuse = 0, surs = 0;
  for (const [id, l] of Object.entries(L)) {
    const c = cats[l.cat]; if (!c || !CAT[l.cat]) continue;
    const a = lineAmt(l), b = byLine[id] || {eng:0, paid:0}, real = b.eng + b.paid;
    const counted = CAT[l.cat].kind === "produit" && l.status === "refuse" ? 0 : a;

    c.proj += CAT[l.cat].kind === "produit" && l.status === "refuse" ? real : Math.max(a, real);

    cats, byLine, charges, produits, attente, refuse,
    resultat: produits - charges, resultatSur: surs - charges,
    depReal: sum("charge","real"), depPaid: sum("charge","paid"),
    recReal: sum("produit","real"), recPaid: sum("produit","paid"),

}

function months() {
  const st = settings(); const out = [];
  let [y, m] = st.start.split("-").map(Number); const [ey, em] = st.end.split("-").map(Number);
  let guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard++ < 36) { out.push({y, m}); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function treasury() {
  const ms = months(); const es = Object.values(S.entries);
  const key = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
  const sPaid = [], sAll = []; let cp = 0, ca = 0;
  for (const {y, m} of ms) {
    const k = key(y, m);
    for (const e of es) {
      if (!e.date || e.date.slice(0, 7) !== k) continue;
      const v = (e.type === "recette" ? 1 : -1) * (+e.amount || 0);
      ca += v; if (e.status === "paye") cp += v;
    }
    sPaid.push(r2(cp)); sAll.push(r2(ca));
  }
  // opérations avant le début de l'exercice
  const first = key(ms[0].y, ms[0].m);
  const before = es.filter(e => e.date && e.date.slice(0, 7) < first);
  if (before.length) {
    const bp = before.filter(e => e.status === "paye").reduce((s, e) => s + (e.type === "recette" ? 1 : -1) * e.amount, 0);
    const ba = before.reduce((s, e) => s + (e.type === "recette" ? 1 : -1) * e.amount, 0);
    for (let i = 0; i < ms.length; i++) { sPaid[i] = r2(sPaid[i] + bp); sAll[i] = r2(sAll[i] + ba); }
  }
  const W = 640, H = 230, L = 58, R = 16, T = 14, B = 30;
  const all = [...sPaid, ...sAll, 0];
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 1000) { hi = Math.max(hi, 1000); lo = Math.min(lo, -1000); }
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => L + (ms.length === 1 ? 0 : i * (W - L - R) / (ms.length - 1));
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi + 1e-6; v += step) g += `<line class="${Math.abs(v) < 1e-6 ? "bl" : "gl"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`;
  ms.forEach((mm, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${MOIS[mm.m - 1]}</text>`; });
  const path = s => s.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
  const area = s => `${path(s)}L${x(s.length - 1)} ${y(0)}L${x(0)} ${y(0)}Z`;
  // repère « aujourd'hui »
  const t = todayISO(); const ti = ms.findIndex(mm => key(mm.y, mm.m) === t.slice(0, 7));
  let today = "";
  if (ti >= 0) { const dd = +t.slice(8, 10) / 31; const tx = x(ti) - (ti > 0 ? (1 - dd) * (x(1) - x(0)) : 0); today = `<line x1="${tx}" x2="${tx}" y1="${T}" y2="${H - B}" stroke="var(--route)" stroke-width="1"/><text x="${tx + 4}" y="${T + 10}" style="fill:var(--ink-2);font-weight:600">aujourd'hui</text>`; }
  const hasData = es.length > 0;
  const lastI = ms.length - 1;
  const cols = ms.map((mm, i) => {
    const x0 = i === 0 ? L : (x(i - 1) + x(i)) / 2, x1 = i === lastI ? W - R : (x(i) + x(i + 1)) / 2;
    const tip = `${MOIS[mm.m - 1]} ${mm.y}\nSolde payé : ${eur(sPaid[i])}\nAvec engagés : ${eur(sAll[i])}`;
    return `<g class="col" tabindex="0" data-tip="${esc(tip)}"><rect class="hit" x="${x0}" y="${T}" width="${x1 - x0}" height="${H - T - B}"/><line class="xh" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}"/></g>`;
  }).join("");
  const endDots = hasData ? `<circle cx="${x(lastI)}" cy="${y(sAll[lastI])}" r="4.5" fill="var(--s2)" stroke="var(--sheet)" stroke-width="2"/><circle cx="${x(lastI)}" cy="${y(sPaid[lastI])}" r="4.5" fill="var(--s1)" stroke="var(--sheet)" stroke-width="2"/>` : "";
  return `<div class="lgd"><span><i style="background:var(--s1)"></i>Solde payé</span><span><i style="background:var(--s2)"></i>Solde avec engagés</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trésorerie cumulée par mois">${g}${today}
    <path d="${area(sPaid)}" fill="var(--s1)" opacity=".1"/>
    <path d="${path(sAll)}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path(sPaid)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${endDots}
    ${hasData ? "" : `<text class="empty-note" x="${(L + W - R) / 2}" y="${y(0) - 12}" text-anchor="middle">Aucune opération saisie : la courbe se remplira au fil des saisies</text>`}
    ${cols}
  </svg>`;
}
function niceStep(raw) {

}

  for (const x of CATS.filter(x => x.kind === "charge")) for (const l of c.cats[x.id].lines) {
    if (l.real > l.amt + .005) add("crit", `Dépassement sur « ${l.cat === "heb" ? l.day + " " + l.label : l.label} »`, `${eur(l.real)} réalisés pour ${eur(l.amt)} prévus (+${eur(l.real - l.amt)}).`);
    else if (l.amt > 0 && l.real >= .9 * l.amt) add("warn", `« ${l.cat === "heb" ? l.day + " " + l.label : l.label} » consommé à ${pc(l.real, l.amt)} %`, `Il reste ${eur(l.amt - l.real)} sur ce poste.`);
  }
  for (const l of CATS.filter(x => x.kind === "produit").flatMap(x => c.cats[x.id].lines)) if (l.status === "attente") add("info", `Recette en attente : ${l.label}`, `${eur(l.amt)} comptés dans le budget mais pas encore confirmés.`);

  const unpaid = crews.filter(cr => crewPaid(cr.id) < (+cr.fee || 0) - .005);

let histLast = {path:"", at:0, id:""};
function logChange(col, id, op, body) {

    const entry = {at:new Date(now).toISOString(), by:ME || "", col, doc:id, op, label:itemLabel(col, id, body || undefined).slice(0, 120)};
    if (histLast.path === path && now - histLast.at < 120000 && op === "set") { DB.collection("history").doc(histLast.id).set(entry).catch(() => {}); histLast.at = now; return; }
    const ref = DB.collection("history").doc(); histLast = {path, at:now, id:ref.id};
    ref.set(entry).catch(() => {});
  } catch (_) {}
}
function startHistory() {

    let q = DB.collection("history");

function icsText() {
  const pad = s => String(s).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ev = [];
  const dt = (iso, hhmm) => iso.replace(/-/g, "") + "T" + String(hhmm || "00:00").replace(":", "") + "00";
  for (const t of sorted(S.tasks)) if (t.due) ev.push(["BEGIN:VEVENT", `UID:task-${t.id}@eat`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${t.due.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${addDays(t.due, 1).replace(/-/g, "")}`, `SUMMARY:${pad((t.done ? "✓ " : "") + (t.ms ? "Jalon · " : "Échéance · ") + (t.t || "Tâche"))}`, `DESCRIPTION:${pad([t.phase, taskWho(t).length ? "Responsable : " + whoNames(t) : ""].filter(Boolean).join(" · "))}`, "END:VEVENT"].join("\r\n"));
  for (const d of dayList()) { const date = dayDate(d); if (!date) continue;
    weekItems(d).forEach((x, i) => { if (tmin(x.dep) == null) { ev.push(["BEGIN:VEVENT", `UID:eat-${d}-${i}-${x.k}@eat`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${date.replace(/-/g, "")}`, `SUMMARY:${pad("EAT " + d + " · " + x.t)}`, "END:VEVENT"].join("\r\n")); return; }
      const w = win(x.dep, x.arr), h = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
      ev.push(["BEGIN:VEVENT", `UID:eat-${d}-${i}-${x.k}@eat`, `DTSTAMP:${stamp}`, `DTSTART;TZID=Europe/Paris:${dt(date, h(w[0]))}`, `DTEND;TZID=Europe/Paris:${dt(date, h(Math.min(w[1], 1439)))}`, `SUMMARY:${pad("EAT " + d + " · " + x.t)}`, `DESCRIPTION:${pad(x.s || WK_L[x.k])}`, "END:VEVENT"].join("\r\n")); });
  }
  return {n:ev.length, text:["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//EIGS'AERO//EAT//FR", "CALSCALE:GREGORIAN", `X-WR-CALNAME:EAT ${settings().exercice}`, ...ev, "END:VCALENDAR"].join("\r\n")};
}

function supaDB(sb) {

  const snap = col => ({docs:Object.entries(cache[col] || {}).map(([id, d]) => ({id, exists:true, data:() => d})), metadata:{fromCache:false}});
  const notify = col => (subs[col] || []).forEach(f => { try { f(snap(col)); } catch (_) {} });

    const row = p.eventType === "DELETE" ? p.old : p.new; if (!row || !row.col || !cache[row.col]) return;
    if (p.eventType === "DELETE") delete cache[row.col][row.id]; else cache[row.col][row.id] = row.data;
    notify(row.col);
  }).subscribe();
  async function load(col) {
    if (loading[col]) return loading[col];
    return loading[col] = (async () => { const out = {}; for (let from = 0; ; from += 1000) { const {data, error} = await sb.from("docs").select("id,data").eq("col", col).range(from, from + 999); if (error) throw error; for (const r of data) out[r.id] = r.data; if (data.length < 1000) break; } cache[col] = out; notify(col); })();
  }

    onSnapshot(cb, err) { (subs[col] ||= []).push(cb); if (cache[col]) cb(snap(col)); else load(col).catch(e => { loading[col] = null; err && err(e); }); return () => {}; },
    doc(id) { id = id || sbUid(); return {id,
      set:async body => { const {error} = await sb.from("docs").upsert({col, id, data:body, updated_at:new Date().toISOString()}); if (error) throw sbErr(error); (cache[col] ||= {})[id] = body; notify(col); },
      delete:async () => { const {error} = await sb.from("docs").delete().eq("col", col).eq("id", id); if (error) throw sbErr(error); if (cache[col]) delete cache[col][id]; notify(col); }}; },
    orderBy() { return c; }, limit() { return c; }}; return c; }};
  return api;
}

    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

async function doUpload(input) {
  const f = input.files && input.files[0], k = input.dataset.upload, cid = CREWMODE ? PROFILE.crew_id : input.dataset.crew; input.value = "";
  if (!f || !cid) return;
  if (f.size > 10 * 1024 * 1024) { toast("Fichier trop lourd : 10 Mo maximum.", true); return; }
  const safe = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.-]+/g, "_").slice(-80), path = `${cid}/${k}/${Date.now()}_${safe}`;
  toast("Envoi en cours…");
  const up = await SB.storage.from("documents").upload(path, f, {contentType:f.type || "application/octet-stream"});
  if (up.error) { toast("Envoi refusé : " + up.error.message, true); return; }
  const ins = await SB.from("uploads").insert({crew_id:cid, doc_key:k, path, name:f.name, size:f.size});
  if (ins.error) { await SB.storage.from("documents").remove([path]); toast("Envoi refusé : " + ins.error.message, true); return; }
  toast("Document envoyé. Merci !"); loadUploads();
}
async function openUp(id) {
  const u = UPLOADS.find(x => x.id === id); if (!u) return;

async function delUp(id) {

function hebPP(days) {

  return {total, part:r ? r.p : 0, org:r ? r.o : 0, split:!!r && sp.nO > 0 && Math.abs(r.p - r.o) > .5};
}

const normName = n => String(n || "").trim().toLowerCase().replace(/\s+/g, " ");

function roomStats(day) {

  for (const n of names) { const k = normName(n); if (seen[k]) dups.add(n.trim()); seen[k] = true; }
  const over = items.filter(r => (r.occ || []).filter(x => String(x || "").trim()).length > (+r.beds || 0));
  return {rooms:items.length, places, lodged:Object.keys(seen).length, dups:[...dups], over, assigned:seen};
}

/* ---------- scénarios ---------- */
function baseScn() {
  const st = settings();
  const sub = {};
  const prodLines = CATS.filter(x => x.kind === "produit").flatMap(x => linesOf(x.id));
  for (const l of prodLines.filter(l => !l.crewOrigin)) sub[l.id] = l.status !== "refuse";
  const e = prodLines.find(l => l.crewOrigin === "eigsi"), h = prodLines.find(l => l.crewOrigin === "hors");
  const o = {people:+st.people || 29, prop:true, eigsi:e ? +e.qty : 0, hors:h ? +h.qty : 0, sub};
  for (const x of CATS.filter(x => x.kind === "charge")) o["v_" + x.id] = 0;
  return o;
}
function simulate(sc) {
  const c = calc(), base = baseScn();
  const ratio = sc.prop ? sc.people / Math.max(1, base.people) : 1;
  const imp = [];
  const chg = {};
  for (const x of CATS.filter(x => x.kind === "charge")) {
    const b = c.cats[x.id].prevu;
    const scale = (x.id === "heb" || x.id === "rep") ? ratio : 1;
    const pv = +sc["v_" + x.id] || 0;
    chg[x.id] = b * scale * (1 + pv / 100);
    const delta = chg[x.id] - b;
    if (Math.abs(delta) > .5) imp.push({l:`${x.short || x.label}${scale !== 1 ? ` (${sc.people} pers.)` : ""}${pv ? ` ${pv > 0 ? "+" : ""}${pv} %` : ""}`, v:-delta});
  }
  let prod = 0;
  for (const l of CATS.filter(x => x.kind === "produit").flatMap(x => linesOf(x.id))) {
    if (l.crewOrigin === "eigsi") { const v = sc.eigsi * l.price; prod += v; if (v !== lineAmt(l)) imp.push({l:`Inscriptions EIGSI (${sc.eigsi})`, v:v - (l.status === "refuse" ? 0 : lineAmt(l))}); }
    else if (l.crewOrigin === "hors") { const v = sc.hors * l.price; prod += v; if (v !== lineAmt(l)) imp.push({l:`Inscriptions hors EIGSI (${sc.hors})`, v:v - (l.status === "refuse" ? 0 : lineAmt(l))}); }
    else { const on = sc.sub[l.id] !== false; const v = on ? lineAmt(l) : 0; prod += v; const was = l.status === "refuse" ? 0 : lineAmt(l); if (v !== was) imp.push({l:`${l.label} ${on ? "obtenu" : "non obtenu"}`, v:v - was}); }
  }
  const charges = Object.values(chg).reduce((s, v) => s + v, 0);
  return {c, charges, prod, res:prod - charges, imp, perPers:charges / Math.max(1, sc.people)};
}
function vScn() {
  if (!UI.scn) UI.scn = baseScn();
  const sc = UI.scn;
  const subs = CATS.filter(x => x.kind === "produit").flatMap(x => linesOf(x.id)).filter(l => !l.crewOrigin);
  const rng = (k, label, min, max, stepv, unit) => `<div class="rng"><div class="top"><label for="sc-${k}">${label}</label><output id="o-${k}" for="sc-${k}">${sc[k] > 0 && unit === "%" ? "+" : ""}${sc[k]}${unit ? " " + unit : ""}</output></div><input type="range" id="sc-${k}" data-s="${k}" min="${min}" max="${max}" step="${stepv}" value="${sc[k]}"></div>`;
  return `<div class="scn">

      <div class="grp">Variation des coûts</div>
      ${CATS.filter(x => x.kind === "charge").map(x => { if (sc["v_" + x.id] == null) sc["v_" + x.id] = 0; return rng("v_" + x.id, esc(x.short), -30, 50, 5, "%"); }).join("")}
    </section>
    <section class="card" id="scn-out"></section>
  </div>`;

    </div>
    ${fix}
    <h3 class="h2" style="font-size:17px;margin:18px 0 10px">Effet de chaque levier sur le résultat</h3>
    ${s.imp.length ? `<div class="imp">${s.imp.map(i => `<div class="r" tabindex="0" data-tip="${esc(i.l + "\n" + eur(i.v, {sign:true}))}"><span>${esc(i.l)}</span><div class="axis"><i class="${i.v >= 0 ? "pos" : "neg"}" style="width:${Math.abs(i.v) / maxAbs * 50}%"></i></div><span class="v">${eur(i.v, {sign:true, round:true})}</span></div>`).join("")}</div>
      <div class="lgd" style="margin-top:10px"><span><i style="background:var(--s1);height:8px"></i>améliore le résultat</span><span><i style="background:var(--crit);height:8px"></i>le dégrade</span></div>`
      : `<div class="empty"><b>Aucun levier activé</b>Bouge un curseur ou décoche une subvention pour voir son effet.</div>`}`;
}

/* plan des chambres d'une nuit */
function roomsDocPages(day, style) {

  const n = linesOf("heb").find(x => x.day === day); if (!n) return [];
  const st = roomStats(day), items = roomsOf(day), date = dayDate(day);
  const people = knownPeople(), notLodged = people.filter(p => !st.assigned[normName(p.name)]);
  const grp = name => { const p = people.find(x => normName(x.name) === normName(name)); return p ? p.group : ""; };
  const pages = chunk(items, 12).map((part, pi, all) => ({
    kicker:"Plan des chambres", head:`${day} · ${n.label}`,
    title:`${esc(day)} <span class="ar">·</span> ${esc(n.label)}`,
    sub:[date ? dayFmt(date) : "", n.hotel ? esc(n.hotel) : "", `${st.rooms} chambre${st.rooms > 1 ? "s" : ""}`].filter(Boolean).join(" · "),
    foot:`Plan des chambres ${day}`,
    body:`${pi === 0 ? `<div class="kf"><div><b>${st.rooms}</b><span>Chambres</span></div><div><b>${st.places}</b><span>Places</span></div><div><b>${st.lodged}</b><span>Personnes logées</span></div><div><b>${Math.max(0, st.places - st.lodged)}</b><span>Places libres</span></div></div>` : ""}
      <div><h2>Répartition${all.length > 1 ? ` (${pi + 1}/${all.length})` : ""}</h2>
      ${part.length ? `<div class="rooms">${part.map(r => { const occ = (r.occ || []).filter(x => String(x || "").trim()), beds = +r.beds || 0;
        return `<div class="room ${occ.length >= beds && beds ? "full" : ""}"><div class="rh"><b>${esc(r.name || "Chambre")}</b><span>${occ.length} / ${beds} pl.</span></div><ol>${occ.map(o => `<li>${esc(o)}${grp(o) ? ` <small>· ${esc(grp(o))}</small>` : ""}</li>`).join("")}${Array.from({length:Math.max(0, beds - occ.length)}, () => `<li class="free">place libre</li>`).join("")}</ol></div>`; }).join("")}</div>` : `<div class="retenir">Aucune chambre saisie pour cette nuit.</div>`}</div>
      ${pi === all.length - 1 && notLodged.length ? `<div><h2>Pas encore placés (${notLodged.length})</h2><div class="chips">${notLodged.map(p => `<span>${esc(p.name)}</span>`).join("")}</div></div>` : ""}
      ${pi === all.length - 1 ? `<div class="retenir"><b>À retenir.</b> Petit-déjeuner inclus. En cas de changement de chambre, prévenir l'organisation EIGS'AERO.</div>` : ""}`,
  }));
  return pages;
}

async function snapDocPages(pages) {
  const host = document.createElement("div");
  host.className = "snap-host"; host.style.width = "794px";
  host.innerHTML = `<style>${docCss()}</style>${buildDoc(pages)}`;
  document.body.appendChild(host);
  const out = [];
  try {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await Promise.all([...host.querySelectorAll("img")].map(im => im.decode().catch(() => {})));
    const css = docCss().replace(/&/g, "&amp;").replace(/</g, "&lt;");
    for (const pg of host.querySelectorAll(".pg")) {
      const W = 794, H = Math.ceil(pg.getBoundingClientRect().height);
      const xhtml = new XMLSerializer().serializeToString(pg);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" class="doc"><style>${css}</style>${xhtml}</div></foreignObject></svg>`;
      const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); await img.decode();
      const k = 2, pageH = 1123;
      for (let y = 0; y < H - 4; y += pageH) {
        const h = Math.min(pageH, H - y), cv = document.createElement("canvas");
        cv.width = W * k; cv.height = pageH * k;
        const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
        g.drawImage(img, 0, y, W, h, 0, 0, W * k, h * k);
        const blob = await new Promise((res, rej) => { try { cv.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", .92); } catch (e) { rej(e); } });
        out.push({bytes:new Uint8Array(await blob.arrayBuffer()), pw:cv.width, ph:cv.height});
      }
    }
  } finally { host.remove(); }
  return out;
}
function pdfPortrait(slices) {
  const PW = 595.28, PH = 841.89;
  const lat = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; };
  const chunks = [], offsets = []; let off = 0;
  const push = b => { chunks.push(b); off += b.length; };
  const obj = (num, parts) => { offsets[num] = off; push(lat(`${num} 0 obj\n`)); for (const p of parts) push(typeof p === "string" ? lat(p) : p); push(lat("\nendobj\n")); };
  push(lat("%PDF-1.4\n%âãÏÓ\n"));
  const n = slices.length;
  obj(1, ["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2, [`<< /Type /Pages /Kids [${slices.map((_, i) => `${3 + 3 * i} 0 R`).join(" ")}] /Count ${n} >>`]);
  slices.forEach((s, i) => {
    const p = 3 + 3 * i, c = p + 1, im = p + 2, cb = lat(`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`);
    obj(p, [`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${c} 0 R >>`]);
    obj(c, [`<< /Length ${cb.length} >>\nstream\n`, cb, "\nendstream"]);
    obj(im, [`<< /Type /XObject /Subtype /Image /Width ${s.pw} /Height ${s.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${s.bytes.length} >>\nstream\n`, s.bytes, "\nendstream"]);
  });
  const total = 3 + 3 * n, xref = off;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  push(lat(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));
  return new Blob(chunks, {type:"application/pdf"});
}

async function exportDoc(kind, day, fmt) {
  const D = DOCS[kind]; if (!D) return;
  const pages = D.pages(day); if (!pages.length) { toast("Rien à exporter pour l'instant.", true); return; }
  const tag = String(day || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w-]+/g, "_");
  const base = `EAT_${settings().exercice}_${D.file}${day && day !== "all" ? "_" + tag : day === "all" ? (kind === "person" ? "_tout_le_monde" : "_toutes_etapes") : ""}`;
  const title = `EAT ${settings().exercice} · ${D.label}${day && day !== "all" ? " · " + day : ""}`;
  if (fmt === "html") return save(base + ".html", docHtmlFile(pages, title));
  if (busy) return; busy = true;
  toast("Préparation du PDF…");
  try { await save(base + ".pdf", pdfPortrait(await snapDocPages(pages))); }
  catch (e) { toast("Ce navigateur ne permet pas de générer le PDF ici. Utilise l'export HTML puis « Imprimer ».", true); }
  finally { busy = false; }
}

    const from = b.dataset.v, to = UI.rday, src = roomsOf(from);
    if (!src.length) { toast(`Aucune chambre à copier pour ${from}.`, true); return; }
    if (roomsOf(to).length && !(await confirmBox(`Remplacer les ${roomsOf(to).length} chambre(s) de ${to} par celles de ${from} ?`, "Remplacer"))) return;
    await saveRooms(to, src.map((r, k) => ({...r, id:"r" + Date.now().toString(36) + k, occ:[...(r.occ || [])]})));
    toast(`Plan des chambres de ${from} copié sur ${to}.`);
  }
  else if (act === "toggleMembers") { (UI.openCrews ||= {})[id] = !UI.openCrews[id]; render(); }
  else if (act === "toggleAllMembers") { const cs = Object.keys(S.crews); UI.openCrews ||= {}; const allOpen = cs.every(k => UI.openCrews[k]); for (const k of cs) UI.openCrews[k] = !allOpen; render(); }
  else if (act === "addMember") {
    const c = S.crews[id]; if (!c) return;
    const mid = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const members = [...(c.members || []).map(m => ({...m})), {id:mid, first:"", last:"", diet:"", allergy:"", room:""}];
    (UI.openCrews ||= {})[id] = true;
    await saveDoc("crews", id, {...c, members, persons:members.length});
    setTimeout(() => { const el = document.getElementById(`m-${id}-${mid}-first`); if (el) el.focus(); }, 150);
  }
  else if (act === "delMember") {
    const [cid, mid] = id.split("|"), c = S.crews[cid]; if (!c) return;
    const m = (c.members || []).find(x => x.id === mid);
    if (m && memName(m) && !(await confirmBox(`Retirer ${memName(m)} de l'équipage ?`, "Retirer"))) return;
    const members = (c.members || []).filter(x => x.id !== mid).map(x => ({...x}));
    saveDoc("crews", cid, {...c, members, persons:members.length});
  }
  else if (act === "addOrg") {
    const os = sorted(S.orgs); const nid = newId("orgs");
    await saveDoc("orgs", nid, {order:(os.length ? Math.max(...os.map(o => o.order || 0)) : 0) + 1, name:"", role:"", transport:"", nights:linesOf("heb").length || 7, note:""});
    setTimeout(() => { const el = document.getElementById(`o-${nid}-name`); if (el) el.focus(); }, 120);
  }
  else if (act === "delOrg") {
    const o = S.orgs[id];
    if (await confirmBox(`Retirer ${o.name ? "« " + o.name + " »" : "cet organisateur"} de l'équipe ?`, "Retirer")) removeDoc("orgs", id);
  }
  else if (act === "applyPeople") {
    const t = people().total; if (t < 1) return;
    await saveDoc("meta", "settings", {...settings(), people:t});
    toast(`Budget recalculé pour ${t} participants.`);
  }
  else if (act === "resetScn") { UI.scn = baseScn(); render(); }
  else if (act === "xlsx") exportXlsx();
  else if (act === "exportPage") exportPage(b.dataset.v, b.dataset.fmt);
  else if (act === "reportPdf") exportPdf(REPORT_VIEWS, `EAT_${settings().exercice}_Rapport_complet.pdf`);
  else if (act === "reportHtml") save(`EAT_${settings().exercice}_Rapport_complet.html`, pageHtmlDoc(REPORT_VIEWS));
  else if (act === "csv") save(`Journal_EAT_${settings().exercice}.csv`, csvJournal());
  else if (act === "docHtml") save(`Budget_previsionnel_EAT_${settings().exercice}.html`, docHtml());
  else if (act === "copyCsv") { try { await navigator.clipboard.writeText(csvJournal().replace(/^﻿/, "")); toast("Journal copié : colle-le dans un tableur."); } catch (_) { toast("Copie refusée par le navigateur.", true); } }
});

/* tooltip partagé */
const tip = $("#tip");
function showTip(el) {
  const txt = el.getAttribute("data-tip"); if (!txt) return;
  tip.textContent = txt; tip.classList.add("on");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 8;
  if (y < 6) y = r.bottom + 8;
  x = Math.max(6, Math.min(x, innerWidth - tw - 6));
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el) showTip(el); else tip.classList.remove("on"); });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (el) showTip(el); else tip.classList.remove("on"); });
document.addEventListener("scroll", () => tip.classList.remove("on"), {passive:true});

/* ---------- recherche globale ---------- */
function searchIndex() {
  const out = [], add = (type, label, sub, go) => out.push({type, label, sub, go, f:fold(label + " " + sub)});
  for (const p of directory()) add("Personne", p.name, p.kind === "crew" ? p.group : p.role, {person:p.name});
  for (const c of sorted(S.crews)) add("Équipage", c.name || "Équipage", [(CREW_ST[c.status] || {}).l, c.plane].filter(Boolean).join(" · "), {href:"#equipages"});
  for (const n of linesOf("heb")) add("Étape", `${n.day} · ${n.label}`, [n.hotel, n.date ? fmtDate(n.date) : ""].filter(Boolean).join(" · "), {href:"#hebergement", day:n.id});
  for (const v of vehicles()) add("Véhicule", v.name, `${VTYPE[v.type] || v.type || ""} · ${v.seats || "?"} places`, {href:"#deplacements/vehicules"});
  for (const x of servicesSorted()) add("Service", `${x.day} ${hm(x.dep, x.arr)} · ${x.purpose || "Service"}`, x.place || "", {href:"#deplacements/services"});
  for (const l of legsSorted()) add("Trajet", `${l.day || ""} · ${l.from || "?"} → ${l.to || "?"}`, hm(l.dep, l.arr), {href:"#deplacements/trajets"});
  for (const e of sorted(S.events)) add("Épreuve", e.name || "Épreuve", e.day || "", {href:"#sportif"});
  for (const c of CATS) for (const l of linesOf(c.id).filter(l => c.id !== "heb")) add("Budget", l.label || "Poste", c.short, {href:"#budget"});
  for (const t of sorted(S.tasks)) add("Tâche", t.t || "Tâche", [t.phase, t.due ? fmtDate(t.due) : "", t.done ? "faite" : ""].filter(Boolean).join(" · "), {href:"#planning"});
  for (const d of sorted(S.decisions)) add("Décision", d.t || "Décision", [DEC_ST[d.st || "ouvert"], d.due ? fmtDate(d.due) : ""].filter(Boolean).join(" · "), {href:"#planning"});
  for (const c of sorted(S.contacts)) add("Contact", c.name || "Contact", [c.type, c.phone, c.who].filter(Boolean).join(" · "), {href:"#contacts"});
  for (const a of sorted(S.airfields)) add("Aérodrome", [a.oaci, a.name].filter(Boolean).join(" · ") || "Aérodrome", [a.day, a.freq].filter(Boolean).join(" · "), {href:"#aerodromes"});
  for (const x of sorted(S.logbook)) add("Main courante", x.t || "Événement", [x.type, x.at ? x.at.replace("T", " ") : ""].filter(Boolean).join(" · "), {href:"#maincourante"});
  for (const x of sorted(S.schedule)) add("Échéance", x.label || "Échéance", [x.date ? fmtDate(x.date) : "", x.amount ? eur(x.amount) : ""].filter(Boolean).join(" · "), {href:"#tresorerie"});
  for (const a of sorted(S.agenda)) add("Activité", a.t || "Activité", [a.day, hm(a.dep, a.arr), a.place].filter(Boolean).join(" · "), {href:"#semaine"});
  for (const v of VIEWS) add("Page", viewLabel(v.id), spaceOf(v.id).l, {href:"#" + v.id});
  return out;
}
const GS = {items:[], idx:0};
function gsRender() {
  const inp = $("#gsearch"), pop = $("#gs-pop"), q = fold(inp.value);
  if (!q) { pop.hidden = true; return; }
  const words = q.split(/\s+/).filter(Boolean);
  GS.items = searchIndex().filter(x => words.every(w => x.f.includes(w))).slice(0, 12);
  if (GS.idx >= GS.items.length) GS.idx = 0;
  pop.innerHTML = GS.items.length ? GS.items.map((x, i) => `<div class="gs-o ${i === GS.idx ? "on" : ""}" role="option" data-i="${i}" aria-selected="${i === GS.idx}"><span class="gs-t">${esc(x.type)}</span><b>${esc(x.label)}</b><small>${esc(x.sub || "")}</small></div>`).join("") : `<div class="gs-e">Aucun résultat pour « ${esc(inp.value)} »</div>`;
  pop.hidden = false;
}
function gsGo(i) {
  const x = GS.items[i]; if (!x) return;
  const inp = $("#gsearch"); inp.value = ""; $("#gs-pop").hidden = true; inp.blur();
  if (x.go.person) { personSheet(x.go.person); return; }
  location.hash = x.go.href;
  if (x.go.day) setTimeout(() => { const el = document.getElementById("day-" + x.go.day); if (el) el.scrollIntoView({behavior:"smooth", block:"center"}); }, 250);
  else window.scrollTo(0, 0);
}
{
  const inp = document.getElementById("gsearch"), pop = document.getElementById("gs-pop");
  inp.addEventListener("input", () => { GS.idx = 0; gsRender(); });
  inp.addEventListener("focus", gsRender);
  inp.addEventListener("blur", () => setTimeout(() => { pop.hidden = true; }, 150));
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); GS.idx = Math.min(GS.items.length - 1, GS.idx + 1); gsRender(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); GS.idx = Math.max(0, GS.idx - 1); gsRender(); }
    else if (e.key === "Enter") { e.preventDefault(); gsGo(GS.idx); }
    else if (e.key === "Escape") { inp.value = ""; pop.hidden = true; inp.blur(); }
  });
  pop.addEventListener("mousedown", e => { e.preventDefault(); const o = e.target.closest(".gs-o"); if (o) gsGo(+o.dataset.i); });
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); inp.focus(); inp.select(); }
    else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); }
    else if (e.key === "Escape" && $("#modal").innerHTML && !$("#modal .dlg")) $("#modal").innerHTML = "";
  });
}

window.addEventListener("hashchange", () => { tip.classList.remove("on"); render(); window.scrollTo(0, 0); });
applyMode();
render();
if (window.__SEED || window.__SUPA_MOCK) window.__T = {S, whoNames, meOrg, parseTaskLines};
boot();
